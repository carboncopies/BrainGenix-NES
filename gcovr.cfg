# gcovr configuration: the "testable core" of BrainGenix-NES (dev_frame tasks/NES-TESTING.md §3).
# Changing this file is a reviewed decision, never a way to raise the number.
# Run from the repository root (Tools/Coverage.sh does this). Paths are relative to it.

root = .
filter = Source/Core/

# Not testable: entry point, GPU visualizer, profiling harness, debug helpers
exclude = Source/Core/Main\.cpp
exclude = Source/Core/Visualizer/.*
exclude = Source/Core/Profiling/.*
exclude = Source/Core/VSDA/DebugHelpers/.*

# Test code and test helpers
exclude = .*\.test\.cpp
exclude = Source/Core/TestUtil/.*

# Dead code (compiled or commented out, no runtime caller)
exclude = Source/Core/VSDA/EM/VoxelSubsystem/LegacySliceGenerator\.cpp
exclude = Source/Core/VSDA/EM/MeshGenerator/.*
exclude = Source/Core/Simulator/BallAndStick/BSAligned.*
exclude = Source/Core/Simulator/BallAndStick/BSMorphology.*
exclude = Source/Core/Simulator/Receptors/.*

# Vendored third-party files
exclude = .*seung_compress_segmentation.*
exclude = .*/MC\.h
exclude = .*/MarchingCubesLookupTable\.h
exclude = .*/iir_gauss_blur\.h

# Never measure dependencies or generated code
exclude = .*/ThirdParty/.*
exclude = .*/vcpkg.*
exclude = .*/Build.*/.*

# Branch noise: compiler-generated exception edges on throw/try would otherwise
# dominate branch % in C++ with STL. Line coverage is the gated metric.
exclude-throw-branches = yes
exclude-unreachable-branches = yes
exclude-noncode-lines = yes

print-summary = yes
sort = uncovered-percent
